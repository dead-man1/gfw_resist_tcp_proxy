# gfk server config (runs on the VPS, needs root).
mode: server
transport: kcp            # kcp (default) or quic

carrier:
  vps_ip: ""              # OPTIONAL on the server: leave empty to auto-derive the
                          #   reply source IP per client from inbound packets
                          #   (recommended; also correct on 1:1-NAT clouds like
                          #   AWS/GCP). Set an IP only to force a specific source.
  server_port: 45000      # carrier TCP port base (must be closed to the OS; gfk handles RSTs)
  server_port_span: 8     # accept N ports from server_port; client rotates across them to escape a blocked port. MUST match client
  # (no client_port here: the server learns each client's real source port from packets)
  interface: ""           # auto-detect; set e.g. "eth0" if detection is wrong
  mtu: 1400               # max carrier payload; IP packet = mtu + 40
  tcp_flags: [ack, psh]   # control bits on every carrier packet: any of ack, psh (push), urg, fin.
                          # Default [ack, psh] = what a real mid-stream data segment carries.
                          # syn and rst are REFUSED: a SYN is the one packet the GFW matches
                          # against its IP blocklist, and a RST tears the flow down everywhere.
                          # Need NOT match the client (each side only crafts its own packets).
  seq_mode: fixed         # fixed | realistic — TCP sequence numbers on carrier packets.
                          #   fixed:     seq = ack = 1 always. Safest with window-tracking NAT.
                          #   realistic: BOTH seq and ack behave like a real connection, tracked
                          #              per client: random ISN, seq grows by the payload length,
                          #              ack tracks that client's stream forward-only, restarting
                          #              at the ISN instead of overflowing.
                          # MUST MATCH THE CLIENT. Not because gfk reads the peer's numbers (it
                          # doesn't) but because a stateful NAT checks a climbing seq against the
                          # peer's ack: a fixed peer acks 1 forever, so ~64 KB later that
                          # direction is out-of-window and dropped (the ~24s death).
                          # realistic+realistic or fixed+fixed — never one of each.

firewall:
  manage: ask             # ask | yes | no  (use "yes" under systemd)

auth:
  key: "CHANGE-ME-long-random-shared-secret"

kcp:
  nodelay: 1              # 1 = low-latency mode (fast flush + ACK); 0 = normal (lower CPU, more delay)
  interval: 10            # internal update/flush period, ms (10 = responsive, 20-40 = lower CPU)
  resend: 2               # fast-retransmit after this many duplicate ACKs; 0 = disabled
  nc: 1                   # 1 = no congestion control (KCP's normal mode); 0 = CC on (usually WORSE here)
  sndwnd: 128             # send window, packets — the MAIN speed/latency knob
  rcvwnd: 128             # receive window, packets. Set near BDP: pkts ≈ bandwidth_bps × RTT_s / 8 / mtu.
                          # too small = caps speed; too large = bufferbloat (high jitter). See profiles.
  fec_data: 0             # Reed-Solomon FEC data shards; 0 = FEC off (saves bandwidth)
  fec_parity: 0           # parity shards (losses recovered per group); MUST match on both ends
  stream_buffer: 0        # smux per-connection buffer, bytes. 0 = auto (from window); override only if needed
  session_buffer: 0       # smux whole-tunnel buffer, bytes. 0 = auto
  # ── profiles: set the SAME nc + window on client AND server ──
  # dial-up ≤256 kbps    : sndwnd/rcvwnd:16
  # slow 1-6 Mbps        : sndwnd/rcvwnd:128   (default)
  # broadband 10-50 Mbps : sndwnd/rcvwnd:512
  # fast 100-500 Mbps    : sndwnd/rcvwnd:8192
  # lossy / adversarial  : add fec_data:10  fec_parity:3 (both ends)

server:
  backend_ip: "127.0.0.1" # where forwarded connections are dialed (e.g. local xray)
  allow_socks5: false     # true = let clients dial arbitrary targets (SOCKS mode)
  allowed_ports: []       # restrict destination ports, e.g. [443, 2096, 2052]. Empty = any port.

# none | error | warn | info | debug
#   none  = log nothing at all: no client IP is ever written to the log
#   error = failures only        warn = failures + warnings
#   info  = normal operation, client IPs masked to their first two octets (140.170.*.*:443)
#   debug = everything, client IPs in full — troubleshooting only; this log identifies your users
log_level: info
