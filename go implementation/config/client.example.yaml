# gfk client config (runs on your PC, needs admin + Npcap on Windows / root on Linux).
mode: client
transport: kcp            # must match the server

carrier:
  vps_ip: "203.0.113.10"  # the SERVER's public (filtered) IP
  server_port: 45000      # must match the server (base of the server-port span)
  server_port_span: 8     # server accepts N ports; client rotates dest across them on reconnect to escape a blocked port. MUST match server
  client_port: 40000      # carrier TCP source port on this machine (base of the rotation range)
  client_port_span: 8     # rotate source port across N ports on reconnect (avoids session collision); 1 = off
  interface: ""           # auto-detect; set the NIC name if detection is wrong
  mtu: 1400               # must match the server
  tcp_flags: [ack, psh]   # control bits on every carrier packet: any of ack, psh (push), urg, fin.
                          # Default [ack, psh] = what a real mid-stream data segment carries.
                          # syn and rst are REFUSED: a SYN is the one packet the GFW matches
                          # against its IP blocklist, and a RST tears the flow down everywhere.
                          # Independent of the server's setting (the peer ignores the bits).
  seq_mode: fixed         # fixed | realistic — TCP sequence numbers on carrier packets.
                          #   fixed:     seq = ack = 1 always. Safest with window-tracking NAT,
                          #              but a capture makes the tunnel obvious.
                          #   realistic: the whole header looks like an established connection —
                          #              random ISN with seq growing by the payload length; an ack
                          #              that starts plausible then tracks the server forward-only;
                          #              a window that jitters near 65535; and RFC 7323 timestamps
                          #              (NOP,NOP,TS) as a real stack sends mid-stream. Past 4.29 GB
                          #              the sequence rolls over modulo 2^32 and the stream carries
                          #              on, exactly as TCP does. Only the SYN is missing.
                          #              Costs 12 header bytes, taken off the payload so the IP
                          #              packet stays exactly mtu+40 either way.
                          # MUST MATCH THE SERVER. Not because gfk reads the peer's numbers (it
                          # doesn't) but because a stateful NAT checks your climbing seq against
                          # the peer's ack: a fixed peer acks 1 forever, so ~64 KB later every
                          # packet you send is out-of-window and dropped (the ~24s death).
                          # realistic+realistic or fixed+fixed — never one of each.
  send_reset_and_wait_before_connect: no
                          # yes|no — default no. Leave it off unless you are recovering a stuck
                          # port; see below for why it is not needed in normal operation.
                          #
                          # BACKGROUND. A middlebox (conntrack, CGNAT) keeps its entry for the
                          # carrier flow long after a session ends — Linux holds ESTABLISHED for
                          # FIVE DAYS — and that entry still remembers the old session's sequence
                          # window. With seq_mode: realistic the next session opens at a fresh
                          # random ISN, lands nowhere near that window, and every packet is
                          # dropped. The port then stays dead even if you restart BOTH ends,
                          # because the stuck state is in the middle, not in either endpoint.
                          # The symptom is "each reconnect only works on the next port, until the
                          # span runs out".
                          #
                          # NORMALLY HANDLED FOR YOU, with no setting and no delay: the client
                          # sends a bare RST on a tuple whenever it LETS GO of it — session lost,
                          # connect attempt failed, or shutdown. That starts the middlebox's close
                          # timer immediately, so by the time the port rotation comes back around
                          # the entry is long gone.
                          #
                          # THIS OPTION is the recovery path for a tuple poisoned by a run that
                          # never got to release it (an older build, a crash, kill -9). Set yes
                          # and gfk also resets and then WAITS 12 SECONDS before every connect
                          # attempt — long enough to outlast the middlebox's close timer, which is
                          # 10s on Linux (nf_conntrack_tcp_timeout_close). A shorter wait is worse
                          # than none: each attempt would restart that timer and the tunnel would
                          # never connect at all.
                          # Turn it on, get connected once, then turn it back off — the wait is
                          # paid on EVERY attempt, including the first.
                          # Client-only; the server ignores it.

firewall:
  manage: ask             # ask | yes | no

auth:
  key: "CHANGE-ME-long-random-shared-secret"  # must match the server

kcp:
  nodelay: 1              # 1 = low-latency mode (fast flush + ACK); 0 = normal (lower CPU, more delay)
  interval: 10            # internal update/flush period, ms (10 = responsive, 20-40 = lower CPU)
  resend: 2               # fast-retransmit after this many duplicate ACKs; 0 = disabled
  nc: 1                   # 1 = no congestion control (KCP's normal mode); 0 = CC on (usually WORSE here)
  sndwnd: 128             # send window, packets — the MAIN speed/latency knob
  rcvwnd: 128             # receive window, packets. Set near BDP: pkts ≈ bandwidth_bps × RTT_s / 8 / mtu.
                          # too small = caps speed; too large = bufferbloat (high jitter). See profiles.
  fec_data: 0             # Reed-Solomon FEC data shards; 0 = FEC off (saves bandwidth)
  fec_parity: 0           # parity shards (losses recovered per group); MUST match on both ends
  stream_buffer: 0        # smux per-connection buffer, bytes. 0 = auto (from window); override only if needed
  session_buffer: 0       # smux whole-tunnel buffer, bytes. 0 = auto
  # ── profiles: set the SAME nc + window on client AND server ──
  # dial-up ≤256 kbps    : sndwnd/rcvwnd:16
  # slow 1-6 Mbps        : sndwnd/rcvwnd:128   (default)
  # broadband 10-50 Mbps : sndwnd/rcvwnd:512
  # fast 100-500 Mbps    : sndwnd/rcvwnd:8192
  # lossy / adversarial  : add fec_data:10  fec_parity:3 (both ends)

client:
  # SOCKS5 proxy for any app (requires server allow_socks5: true). Empty disables.
  # Same listen rule as the forwards below: 127.0.0.1 = this PC only, 0.0.0.0 = the LAN too.
  socks5_listen: "127.0.0.1:1080"

  # PORT-FORWARDS. Each entry is one local listener wired to one port on the VPS:
  #
  #     listen: "<local_ip>:<local_port>"   ->   target_port: <xray_inbound_port_on_vps>
  #
  # traffic that send to <local_ip>:<local_port> on THIS MACHINE comes to server.backend_ip:<target_port> 
  # (backend_ip is set in server.yaml and is 127.0.0.1 by default). 
  # The VPS port does NOT have to be open to the internet — the traffic arrives from inside the tunnel.
  #
  #   listen: "127.0.0.1:14000"   only programs on this PC can connect
  #   listen: "0.0.0.0:14000"     any device on your LAN (phones, TVs, other PCs)
  #
  # Below: connect to 127.0.0.1:14000 on this PC and you reach port 2096 on the VPS.
  forwards:
    - {proto: tcp, listen: "127.0.0.1:14000", target_port: 2096}
    - {proto: tcp, listen: "127.0.0.1:15000", target_port: 443}
    - {proto: tcp, listen: "127.0.0.1:16000", target_port: 2083}
    - {proto: udp, listen: "127.0.0.1:17000", target_port: 945}
  # - {proto: tcp, listen: "0.0.0.0:14000",  target_port: 2096}   # same, but LAN-reachable
  keepalive_seconds: 4    # heartbeat; keeps the NAT pinhole open. Dead-peer detect ~= 2x this
  reconnect_seconds: 2    # delay between reconnect attempts

# none | error | warn | info | debug
#   none  = log nothing at all (no addresses can leak)
#   error = failures only        warn = failures + warnings
#   info  = normal operation, peer IPs masked to their first two octets (140.170.*.*:443)
#   debug = everything, peer IPs in full — for troubleshooting, not for pasting in public
log_level: info
